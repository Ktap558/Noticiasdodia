name: Atualizar notícias e publicar PWA
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar notícias dos feeds RSS
        run: python scripts/atualizar.py
      - name: Conferir se as notícias foram baixadas
        run: python -c "import json; d=json.load(open('noticias.json')); assert len(d['items']) > 0, 'Arquivo de notícias vazio'; print(len(d['items']), 'notícias prontas para publicar')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
